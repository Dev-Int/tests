name: Tests

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]
env:
    DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/app?serverVersion=16&charset=UTF-8'

jobs:
    lint:
        strategy:
            fail-fast: false
            matrix:
                php-versions: ['8.3', '8.4', '8.5']
        runs-on: ubuntu-latest
        name: Lint / PHP ${{ matrix.php-versions }}
        services:
            postgres:
                image: 'postgres:16'
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: app
                ports:
                    - '5432:5432'
                options: '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5'
        steps:
            - uses: actions/checkout@v2

            - name: Setup PHP with PECL extension
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: apcu, intl, opcache, zip, pdo_pgsql

            - name: Validate composer.json and composer.lock
              run: composer validate

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-suggest

            - name: Run coding standards analysis
              run: |
                  make clean-db
                  composer run-script schema-validate
                  composer run-script phpcs
                  composer run-script phpstan
                  composer run-script rector

            - name: Run linters
              run: |
                  php bin/console lint:yaml config
                  php bin/console lint:twig templates/ src/**/Frameworks/templates/

            - name: Validate IA docs templates
              run: bin/validate-templates

    test:
        strategy:
            fail-fast: false
            matrix:
                php-versions: ['8.3', '8.4', '8.5']
        runs-on: ubuntu-latest
        name: Tests / PHP ${{ matrix.php-versions }}
        services:
            postgres:
                image: 'postgres:16'
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: app_test
                ports:
                    - '5432:5432'
                options: '--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5'
        steps:
            - uses: actions/checkout@v2

            - name: Setup PHP with PECL extension
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php-versions }}
                  extensions: apcu, intl, opcache, zip, pdo_pgsql

            - name: Validate composer.json and composer.lock
              run: composer validate

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-suggest

            # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
            # Docs: https://getcomposer.org/doc/articles/scripts.md

            - name: Run test suite
              run:  |
                  cp phpunit.xml.dist phpunit.xml
                  php bin/console importmap:install
                  make clean-db-test
                  php bin/phpunit --testsuite "Unit Test Suite" --testsuite "Functional Test Suite" --coverage-clover=clover.xml
              env:
                  XDEBUG_MODE: coverage

            - name: Generate test coverage badge
              uses: timkrase/phpunit-coverage-badge@v1.2.1
              with:
                  coverage_badge_path: output/coverage.svg
                  push_badge: false

            - name: Git push to image-data branch
              uses: peaceiris/actions-gh-pages@v3
              with:
                  publish_dir: ./output
                  publish_branch: image-data
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  user_name: 'github-actions[bot]'
                  user_email: 'github-actions[bot]@users.noreply.github.com'
