name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        id: install-claude
        run: |
          npm install -g @anthropic-ai/claude-code@2.0.76
          echo "claude_path=$(which claude)" >> $GITHUB_OUTPUT

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1.0.27
        timeout-minutes: 15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ steps.install-claude.outputs.claude_path }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Analyse cette PR en te basant sur CLAUDE.md et docs/CODE_REVIEW.md du projet.

            ## RÈGLES ANTI FAUX-POSITIFS (OBLIGATOIRE)

            AVANT de signaler un problème, vérifie ces points :

            ### Architecture DDD
            - Adapters/Gateway/ORM → Adapters : PAS une violation (même couche)
            - Controller → UseCase direct : CORRECT (pas d'interface nécessaire)
            - UseCase fusionne plusieurs étapes : décision intentionnelle
            - Ne critique PAS le passage par référence `&$entity` (convention)

            ### Types et Calculs
            - bcmath pour Quantity : CORRECT (précision décimale)
            - Millièmes (INTEGER) pour stocks : CORRECT
            - FLOAT pour ratios packaging : CORRECT (pas des stocks)

            ### Deptrac
            - Adapters peut dépendre de UseCases, Entities, Shared, OtherBC\Contracts
            - Ne signale PAS de violation si la dépendance est dans ces règles

            ### Migrations Doctrine
            - Séquences PostgreSQL gérées par Doctrine 3.x : CORRECT
            - UNIQUE INDEX sur FK : contrainte explicite valide

            ### Tests
            - VÉRIFIE que le test n'existe pas avant de dire "test manquant"
            - Cherche dans *Test.php et les DataProviders

            ## FORMAT (strict)
            - Maximum 150 lignes
            - Seulement problèmes RÉELS et VÉRIFIÉS
            - Si pas SÛR à 100%, ne le mentionne pas

            ## Structure
            ## 🔴 Problèmes Bloquants (bugs réels uniquement)
            ## ⚠️ Points d'Attention (max 3, vérifiés)
            ## ✅ Points Positifs (max 3)

            Utilise `gh pr comment` pour poster. Sois constructif.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

