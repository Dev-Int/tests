name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Analyse cette pull request en te basant sur CLAUDE.md du projet pour les conventions.

            IMPORTANT - Contraintes de format :
            - Maximum 200 lignes de commentaire (c'est strict !)
            - Focus sur les problèmes critiques et bloquants uniquement
            - Pas de tableaux complexes, utilise des listes simples
            - Sois concis et direct

            Structure attendue :
            ## 🔴 Problèmes Bloquants (si présents)
            - Liste des bugs critiques avec fichier:ligne

            ## ⚠️ Points d'Attention (max 5)
            - Problèmes importants mais non-bloquants

            ## ✅ Points Positifs (optionnel, max 3 items)
            - Ce qui est bien fait

            ## 💡 Suggestions (optionnel, max 3 items)
            - Améliorations possibles

            Focus sur :
            - Architecture DDD (respect des couches Entities → UseCases → Adapters)
            - Dépendances Deptrac (pas de violations)
            - Tests (présence et qualité)
            - Bugs évidents ou problèmes de sécurité

            Utilise `gh pr comment` pour poster ta review. Sois constructif et pragmatique.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

