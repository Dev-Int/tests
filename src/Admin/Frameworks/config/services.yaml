# yaml-language-server: $schema=../../../../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
    
    Admin\:
        resource: '%kernel.project_dir%/src/Admin/*'
        exclude: 
            - '%kernel.project_dir%/src/Admin/{Frameworks,Tests,Entities}'
            - '%kernel.project_dir%/src/Admin/Adapters/Gateway/ORM/Entity'
    Admin\Entities\Repository\:
        resource: '%kernel.project_dir%/src/Admin/Entities/Repository/*'

    Admin\Contracts\Services\Provider\Article\ArticleProvider:
        alias: Admin\Adapters\Gateway\Contracts\Provider\Article\ArticleProvider
        public: true
