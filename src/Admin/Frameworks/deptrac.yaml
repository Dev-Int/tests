deptrac:
    layers:
        - name: Admin\Entities
          collectors:
              - type: classLike
                value: Admin\\Entities\\.*
        - name: Admin\UseCases
          collectors:
              - type: classLike
                value: Admin\\UseCases\\.*
        - name: Admin\Adapters
          collectors:
              - type: classLike
                value: Admin\\Adapters\\.*
    ruleset:
        Admin\Entities:
            - Shared\Entities
        Admin\UseCases:
            - Admin\Entities
            - Shared\Entities
        Admin\Adapters:
            - Admin\Entities
            - Admin\UseCases
            - Shared\Entities
    skip_violations: []
