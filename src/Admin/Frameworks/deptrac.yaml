deptrac:
    layers:
        - name: Admin\Entities
          collectors:
              - type: classNameRegex
                value: '#Admin\\Entities\\.*#'
        - name: Admin\UseCases
          collectors:
              - type: classNameRegex
                value: '#Admin\\UseCases\\.*#'
        - name: Admin\Adapters
          collectors:
              - type: classNameRegex
                value: '#Admin\\Adapters\\.*#'
    ruleset:
        Admin\Entities:
            - Shared\Entities
        Admin\UseCases:
            - Admin\Entities
            - Shared\Entities
        Admin\Adapters:
            - Admin\Entities
            - Admin\UseCases
            - Shared\Entities
    skip_violations: []
