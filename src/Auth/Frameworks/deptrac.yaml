deptrac:
    layers:
        - name: Auth\Entities
          collectors:
              - type: classNameRegex
                value: '#Auth\\Entities\\.*#'
        - name: Auth\UseCases
          collectors:
              - type: classNameRegex
                value: '#Auth\\UseCases\\.*#'
        - name: Auth\Adapters
          collectors:
              - type: classNameRegex
                value: '#Auth\\Adapters\\.*#'
        - name: Auth\Contracts
          collectors:
              - type: classNameRegex
                value: '#Auth\\Contracts\\.*#'
    ruleset:
        Auth\Entities:
            - Shared\Entities
        Auth\UseCases:
            - Auth\Entities
            - Shared\Entities
        Auth\Adapters:
            - Auth\Entities
            - Auth\UseCases
            - Auth\Contracts
            - Shared\Entities
            - Shared\Adapters
        Auth\Contracts:
            - Shared\Entities
    skip_violations: []
