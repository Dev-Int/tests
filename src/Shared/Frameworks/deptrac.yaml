deptrac:
    layers:
        - name: Shared\Entities
          collectors:
              - type: classLike
                value: Shared\\Entities\\.*
        - name: Shared\UseCases
          collectors:
              - type: classLike
                value: Shared\\UseCases\\.*
        - name: Shared\Adapters
          collectors:
              - type: classLike
                value: Shared\\Adapters\\.*
    ruleset:
        Shared\Entities:
        Shared\UseCases:
            - Shared\Entities
        Shared\Adapters:
            - Shared\Entities
            - Shared\UseCases
    skip_violations: []
