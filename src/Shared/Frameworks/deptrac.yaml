deptrac:
    layers:
        - name: Shared\Entities
          collectors:
              - type: classNameRegex
                value: '#Shared\\Entities\\.*#'
        - name: Shared\UseCases
          collectors:
              - type: classNameRegex
                value: '#Shared\\UseCases\\.*#'
        - name: Shared\Adapters
          collectors:
              - type: classNameRegex
                value: '#Shared\\Adapters\\.*#'
    ruleset:
        Shared\Entities:
        Shared\UseCases:
            - Shared\Entities
        Shared\Adapters:
            - Shared\Entities
            - Shared\UseCases
    skip_violations: []
